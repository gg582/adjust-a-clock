; Slava 5671 (61М) 사양 시트
; 사용: clock-rate 녹음.mp3 --시트 sheets/slava_5671.ini
; 비워 둔 값은 비교하지 않거나 도구 기본값을 씁니다. 값 뒤 ; 는 출처·설명입니다.

[meta]
name = Slava 5671 (61М)
maker = 2-й Московский часовой завод (제2모스크바 시계공장)
registry = ГРСИ 6068-77 (1977 등록), ГОСТ 3145-74
repair_standard = РСТ РСФСР 265-78
retrieved = 2026-09-26
source_1 = Л. В. Шамонова, «Ремонт механических будильников», 1987, с. 3, 56–57, 60 — https://www.cccp-forum.it/docs/books/Shamonova%20-%20Remont%20mekhanicheskikh%20budilnikov%20(1987).pdf
source_2 = Госреестр СИ 6068-77 — https://all-pribors.ru/opisanie/6068-77-slava-5671

[movement]
calibre_mm = 55.8            ; «Калибр механизма (приведенный) 55,8 мм»
height_mm = 19               ; «высота 19 мм»
jewels = 11                  ; «Механизм имеет 11 камней»
escapement = 스위스 레버 (свободный анкерный)
balance = 모노메탈 황동 밸런스 + 헤어스프링 (монометаллический латунный со спиралью)
accuracy_class = 1           ; «отвечает требованиям 1-го класса точности»

[oscillator]
period_s = 0.4               ; «Период колебания баланса – 0,4 с» → 18000 bph
bph = 18000
lift_angle_deg =             ; 공식 자료에서 찾지 못함 — 비우면 도구 기본값(52°)으로 진폭 계산

[tolerance]
rate_s_per_day = -60, 60                ; «Суточный ход механизма ±1 мин при температуре +20±5°С»
rate_temperature_c = 15, 25
regulator_range_s_per_day = -180, 180   ; «Регулировка градусником ... от среднего его положения до крайних ... ±3 мин»
amplitude_deg = 180, 310                ; 조정 기준: 약하게 감은 상태 180°, 완전히 감은 상태 310° (с. 56–57).
                                        ; 310°를 넘으면 «пристук»(임펄스 보석이 포크 뒤쪽을 치는 현상)로 빨라질 수 있음
amplitude_variation_deg = 10            ; «Амплитуда должна быть не менее 180°, изменение ее ... не более чем 10°» (с. 60)
wind_rate_difference_s_per_day = 60     ; «Разница ... при различной степени заводки пружины не должна превышать ±1 мин»
power_reserve_h_min = 36                ; «Продолжительность действия механизма от одной полной заводки ... не менее 36 ч»
self_start_turns_max = 1                ; «После заводки пружины не более чем на один оборот механизм должен начать действовать»
beat_error_ms_max =                     ; 교본은 수치 없이 "두 줄 간격이 작을 것"만 요구 — 비우면 도구 기준(5 ms)

[alarm]
duration_s_min = 15          ; «Продолжительность действия сигнала ... не менее 15 с»
set_accuracy_min = 5         ; «Отклонение момента начала подачи сигнала ... не более ±5 мин»
